<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Webpage</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-body">
                <header class="header">
                    <h1>Registration</h1>
                </header>
                <form id="registration">
                    <label for="firstName">First Name:</label>
                    <input type="text" id="firstName" name="firstName" required><br><br>

                    <label for="lastName">Last Name:</label>
                    <input type="text" id="lastName" name="lastName" required><br><br>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required><br><br>

                    <label for="birthday">Birthday:</label>
                    <input type="date" id="birthday" name="birthday" required><br><br>

                    <input type="checkbox" id="interest1" name="interests" value="coding">
                    <label for="interest1">Coding</label>

                    <input type="checkbox" id="interest2" name="interests" value="design">
                    <label for="interest2">Design</label>

                    <input type="checkbox" id="interest3" name="interests" value="gaming">
                    <label for="interest3">Gaming</label><br><br>

                    <button type="register">Register</button>
                </form>
                <div id="output"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
